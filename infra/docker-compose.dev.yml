# Services locaux de développement. Aucun port exposé hors de 127.0.0.1.
# Les mots de passe ci-dessous sont des valeurs de développement local uniquement.
# Le schéma n'est PAS monté ici : il est appliqué par `php artisan migrate` (backend), qui fait foi.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_only
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  pgdata:

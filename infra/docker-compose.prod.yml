# Production : un seul serveur (VPS). Aucun port de base de données ni de Redis n'est publié.
# Non exécuté sur le poste de développement. Variables : voir infra/.env.prod.example (le vrai fichier n'est PAS dans le dépôt).
# Les ${VAR} de ce fichier sont lues dans infra/.env.prod : toujours lancer avec
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml <commande>
# Règle (revue F-17) : seul caddy publie des ports (80, 443). Ni postgres, ni redis, ni reverb (8080), ni php-fpm (9000)
# n'ont de `ports:` ; ils ne sont joignables que sur le réseau `internal`. Ne jamais en ajouter.
name: ayelo

# Journaux de conteneur (sorties standard et d'erreur) : sans plafond, Docker les garde indéfiniment et finit par remplir le
# disque. Au plus 5 fichiers de 10 Mo par conteneur. Pris en compte à la (re)création du conteneur. TOUT service doit le
# porter (vérifié en CI). Les journaux de Laravel (storage/logs) ont leur propre rotation (LOG_DAILY_DAYS).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Base commune des conteneurs PHP. Elle ne porte volontairement PAS `env_file` (revue pentest P-08) : chaque service
# choisit ce qu'il reçoit.
#  - app, worker, worker-push, scheduler exécutent le code applicatif (jobs : e-mail, push, stockage, facturation...) et
#    non exposés à Internet : ils reçoivent le fichier complet via `env_file: .env.prod`.
#  - reverb, exposé à Internet derrière Caddy, ne reçoit qu'une liste explicite (aucune clé de stockage, FCM, LiveKit,
#    RevenueCat, e-mail, ni APP_KEY ni mot de passe de base de données).
x-app: &app
  build:
    context: ..
    dockerfile: infra/php/Dockerfile
    target: runtime
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
  networks: [internal]
  volumes:
    - app-storage:/var/www/html/storage

services:
  caddy:
    image: caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    # Caddy est exposé à Internet : il ne reçoit PAS tout .env.prod (clés, mots de passe), seulement ses variables.
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
      WS_DOMAIN: ${WS_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS}
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes:
      # Le DOSSIER est monté, pas le fichier : un `git pull` remplace le Caddyfile par un nouveau fichier (autre inode) ; un montage
      # de fichier unique garderait l'ancien et `caddy validate` / `caddy reload` liraient l'ancienne configuration.
      - ./caddy:/etc/caddy:ro
      # Site de présentation statique (web/), en lecture seule. tools/ est présent mais jamais servi (Caddyfile, bloc WEB_DOMAIN).
      - ../web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
      - app-public:/var/www/html/public:ro
    depends_on: [app, reverb]
    networks: [internal, edge]

  app:
    <<: *app
    env_file: .env.prod
    command: ["php-fpm"]
    # Les pages du site de présentation (web/) sont remplies par l'application avec les mentions légales saisies depuis le
    # panneau d'administration : dossier monté en lecture seule, comme dans le conteneur caddy (backend/config/site.php).
    environment:
      SITE_WEB_ROOT: /srv/web
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
      - ../web:/srv/web:ro
      # Dossier partagé avec le conteneur `transcode` : lu par `deploy:preflight` (MEDIA_CHAT_AV_ENABLED), jamais écrit ici.
      - transcode-spool:/spool:ro
    # Mémoire plafonnée : le pool FPM (infra/php/php-fpm-pool.conf, FPM_MAX_CHILDREN) est dimensionné pour ce plafond.
    # Changer l'un sans l'autre = soit des processus tués par le noyau (OOM), soit de la RAM inutilisée.
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2g}
    # Vivacité réelle : interroge php-fpm via FastCGI (ping.path = /fpm-ping) ; `php-fpm -t` ne testait que la syntaxe.
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Files d'attente (revue CTO n°1, 2.3). `realtime` (diffusion) passe avant `default` ; `push` (FCM, lent) a son propre
  # worker pour qu'un FCM lent ne retarde ni les messages en direct ni les e-mails.
  # NB : une file n'a de travail que si le code y envoie (`->onQueue('realtime')`, `->onQueue('push')`). Tant que le code
  # n'est pas adapté, tout part sur `default` et ces workers `realtime`/`push` restent au repos sans coût ni risque.
  # Nombre de workers `default` : WORKER_REPLICAS (2 par défaut). Arrêt propre : jusqu'à 70 s pour finir le travail en cours.
  worker:
    <<: *app
    env_file: .env.prod
    command: ["php", "artisan", "queue:work", "--queue=realtime,default", "--tries=3", "--timeout=60", "--sleep=1", "--max-time=3600", "--max-jobs=1000"]
    # Dossier partagé avec le conteneur `transcode` : TranscodeChatMedia y dépose les notes vocales et vidéos, puis lit le résultat.
    volumes:
      - app-storage:/var/www/html/storage
      - transcode-spool:/spool
    stop_grace_period: 70s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:wor[k]' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-push:
    <<: *app
    env_file: .env.prod
    command: ["php", "artisan", "queue:work", "--queue=push", "--tries=3", "--backoff=10", "--timeout=30", "--sleep=2", "--max-time=3600", "--max-jobs=1000"]
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:wor[k]' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ré-encodage des images hors de la requête (MEDIA_ASYNC_IMAGES, tâche SanitizeImageMedia, file `media`) : worker dédié, pour
  # que le décodage d'images ne retarde ni les diffusions ni les e-mails. Sans travail tant que MEDIA_ASYNC_IMAGES=false.
  # Mémoire : le worker plus le sous-processus de ré-encodage (MEDIA_PROCESS_MEMORY_LIMIT, 256M).
  worker-media:
    <<: *app
    env_file: .env.prod
    command: ["php", "artisan", "queue:work", "--queue=media", "--tries=3", "--timeout=60", "--sleep=1", "--max-time=3600", "--max-jobs=500"]
    stop_grace_period: 70s
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:wor[k]' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Traitement des notes vocales et vidéos de conversation (ffmpeg) : fichiers non fiables, donc AUCUN réseau (network_mode: none),
  # système de fichiers en lecture seule, aucune capacité, plafonds de CPU, de mémoire et de processus. Il ne communique avec
  # l'application que par le volume `transcode-spool` (infra/transcode/transcode-loop.sh). Sans effet tant que
  # MEDIA_CHAT_AV_ENABLED=false : il reste au repos (une boucle qui regarde un dossier vide). Voir docs/runbooks/transcode.md.
  transcode:
    build:
      context: ..
      dockerfile: infra/transcode/Dockerfile
    restart: unless-stopped
    logging: *logging
    network_mode: none
    user: "82:82"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - transcode-spool:/spool
    deploy:
      resources:
        limits:
          cpus: "${TRANSCODE_CPUS:-1.5}"
          memory: ${TRANSCODE_MEMORY_LIMIT:-768m}
          # Plafond de processus ici et non en `pids_limit` : Compose v2 refuse les deux ensemble dès qu'un `limits` existe.
          pids: 128
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/alive) )) -lt 30"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Un seul planificateur (tout le nettoyage RGPD en dépend) : ne jamais répliquer ce service.
  scheduler:
    <<: *app
    env_file: .env.prod
    command: ["php", "artisan", "schedule:work"]
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:wor[k]' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Reverb : un seul processus. Descripteurs de fichiers relevés (une connexion WebSocket = un descripteur).
  # À partir de ~1 000 connexions simultanées : REVERB_SCALING_ENABLED=true (Redis pub/sub) et 2 instances (docs/runbooks/dimensionnement.md).
  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    # Liste minimale (P-08). Reverb ne se connecte pas à PostgreSQL : l'autorisation des canaux privés passe par l'API.
    # Si une évolution du code lui faisait ouvrir la base ou chiffrer des données, ajouter ici le strict nécessaire
    # (jamais `env_file: .env.prod`). Les valeurs vides retombent sur les défauts du code.
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-}
      APP_WEB_URL: ${APP_WEB_URL:-}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_CACHE_HOST: ${REDIS_CACHE_HOST:-redis-cache}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2}
      REDIS_READ_WRITE_TIMEOUT: ${REDIS_READ_WRITE_TIMEOUT:-5}
      CACHE_STORE: ${CACHE_STORE:-redis}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      REVERB_APP_ID: ${REVERB_APP_ID:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_HOST: ${REVERB_HOST:-}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-}
      REVERB_APP_ACCEPT_CLIENT_EVENTS_FROM: ${REVERB_APP_ACCEPT_CLIENT_EVENTS_FROM:-none}
      REVERB_APP_RATE_LIMITING_ENABLED: ${REVERB_APP_RATE_LIMITING_ENABLED:-true}
      REVERB_SCALING_ENABLED: ${REVERB_SCALING_ENABLED:-false}
      REVERB_APP_MAX_CONNECTIONS: ${REVERB_APP_MAX_CONNECTIONS:-}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    restart: unless-stopped
    logging: *logging
    # Pas de `env_file: .env.prod` (P-08) : PostgreSQL ne reçoit que ces trois variables.
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Deux instances Redis (revue CTO n°1, 2.3) : une panne mémoire du cache ne doit jamais faire perdre de tâche.
  # `redis` = file d'attente, sessions, compteurs Reverb (connexion Laravel `default`) : AOF toutes les secondes et
  # `noeviction` (jamais d'éviction : à saturation Redis REFUSE les écritures, ce qui se voit, au lieu de perdre des tâches).
  # Aucun port publié. Mot de passe en défense en profondeur (REDIS_PASSWORD, repris par Laravel).
  redis:
    image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec redis-server --appendonly yes --appendfsync everysec --save "" --maxmemory ${REDIS_QUEUE_MAXMEMORY:-512mb} --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # `redis-cache` = cache applicatif et limiteurs de débit (connexion Laravel `cache`, REDIS_CACHE_HOST) : éviction LRU,
  # aucune persistance (perdre le cache est sans conséquence ; les jetons à usage unique et compteurs se reconstruisent).
  redis-cache:
    image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec redis-server --appendonly no --save "" --maxmemory ${REDIS_CACHE_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Sauvegarde quotidienne de PostgreSQL (infra/scripts/backup.sh). Aucun port publié, réseau `internal` seulement
  # (ce réseau n'est pas `internal: true` : la sortie vers le bucket S3/R2 reste possible).
  # Pas de `env_file: .env.prod` ici : le service ne reçoit que les variables listées, pas APP_KEY, FCM, RevenueCat, etc.
  # Les secrets viennent de infra/.env.prod au démarrage (substitution ${...}), jamais de l'image.
  # Planification : attente jusqu'à BACKUP_TIME_UTC (HH:MM, défaut 02:15) ; une erreur est journalisée et la boucle continue.
  # Sonde de santé : « unhealthy » si aucune réussite depuis plus de 36 h (premier jour exclu).
  # Non exécuté sur le poste de développement (Docker absent) : à valider sur le serveur.
  backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-02:15}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MONTHLY_RETENTION_MONTHS: ${BACKUP_MONTHLY_RETENTION_MONTHS:-6}
      BACKUP_ALERT_WEBHOOK_URL: ${BACKUP_ALERT_WEBHOOK_URL:-}
      # Alerte e-mail d'échec (backup.sh) : envoyée par SMTP avec les réglages de l'application. Vide = pas d'e-mail.
      BACKUP_ALERT_EMAIL: ${BACKUP_ALERT_EMAIL:-}
      BACKUP_ALERT_EMAIL_FROM: ${BACKUP_ALERT_EMAIL_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT:-}
      BACKUP_AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      # Chiffrement OBLIGATOIRE : si BACKUP_GPG_RECIPIENT est vide, docker compose refuse de démarrer (toute commande
      # compose échoue avec ce message). Jamais d'archive en clair dans le bucket. Seule la clé PUBLIQUE est montée ci-dessous ;
      # la clé privée reste hors du serveur (docs/runbooks/sauvegardes-chiffrement.md).
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:?BACKUP_GPG_RECIPIENT obligatoire - les sauvegardes doivent etre chiffrees (voir docs/runbooks/sauvegardes-chiffrement.md)}
      BACKUP_GPG_PUBLIC_KEY_FILE: /keys/backup-public.asc
    volumes:
      - backups:/backups
      # Clé publique GPG (export ASCII, `gpg --armor --export <destinataire>`), fichier hors dépôt sur l'hôte.
      # create_host_path: false : si le fichier n'existe pas, compose échoue au lieu de créer un dossier vide.
      - type: bind
        source: ${BACKUP_GPG_PUBLIC_KEY_PATH:?BACKUP_GPG_PUBLIC_KEY_PATH obligatoire - chemin sur l'hote du fichier de cle publique GPG}
        target: /keys/backup-public.asc
        read_only: true
        bind:
          create_host_path: false
    command:
      - /bin/bash
      - -euc
      - |
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "today $$BACKUP_TIME_UTC" +%s)
          if [ "$$next" -le "$$now" ]; then next=$$(date -u -d "tomorrow $$BACKUP_TIME_UTC" +%s); fi
          echo "prochaine sauvegarde dans $$((next - now)) s (à $$BACKUP_TIME_UTC UTC)"
          sleep "$$((next - now))"
          /scripts/backup.sh || echo "ECHEC de la sauvegarde (voir les lignes ci-dessus)" >&2
        done
    healthcheck:
      test: ["CMD-SHELL", "find /backups/.last_success -mmin -2160 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 36h
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  internal: {}
  edge: {}

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  app-storage:
  app-public:
  backups:
  redis-data:
  transcode-spool:

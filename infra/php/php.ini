; Réglages de production
expose_php = Off
display_errors = Off
display_startup_errors = Off
; Revue F-17 : aucune inclusion distante, pas d'identifiant de session dans l'URL, cookies hors de portée de JavaScript.
allow_url_include = Off
session.use_only_cookies = 1
session.cookie_httponly = 1
log_errors = On
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128

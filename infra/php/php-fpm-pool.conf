; Pool PHP-FPM de production (revue CTO n°1, 2.2). Chargé APRÈS www.conf et zz-docker.conf (nom en zz-pool) :
; les clés redéclarées ici l'emportent ; `listen` et `daemonize` restent ceux de l'image (zz-docker.conf).
;
; Dimensionnement : pm.max_children = (mémoire du conteneur `app` - ~256 Mo de marge : opcache, FPM maître,
; sous-processus de ré-encodage d'image) / ~60 Mo par processus FPM. Le conteneur `app` est limité à 2 Go dans
; docker-compose.prod.yml : (2048 - 256) / 60 ≈ 29, arrondi à 24 pour garder de la marge. Les valeurs viennent de
; variables d'environnement (valeurs par défaut posées par l'ENV du Dockerfile) : changer FPM_MAX_CHILDREN dans
; infra/.env.prod ET la limite mémoire du compose ensemble. Détail : docs/runbooks/dimensionnement.md.
[www]
clear_env = no
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}
; Recyclage des processus : limite l'effet des fuites mémoire lentes.
pm.max_requests = ${FPM_MAX_REQUESTS}
; POST /media/{id}/complete (téléchargement R2 + ré-encodage + réécriture) est le plus long : 10 s de ré-encodage
; plus les allers-retours R2. 60 s coupe un processus bloqué sans tuer un envoi lent légitime.
request_terminate_timeout = ${FPM_REQUEST_TERMINATE_TIMEOUT}
; Journal des requêtes lentes vers stderr du conteneur (docker compose logs app).
request_slowlog_timeout = ${FPM_SLOWLOG_TIMEOUT}
slowlog = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
; Sonde de vivacité utilisée par le healthcheck du compose (cgi-fcgi). Non exposée par Caddy (liste blanche /api/* et /up).
ping.path = /fpm-ping
ping.response = pong

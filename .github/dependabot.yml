# Mises à jour automatiques sous forme de demandes de fusion à relire (revue pentest P-15) : les actions GitHub sont épinglées par SHA et
# les images Docker par condensat (sha256), donc rien ne bouge sans demande visible. Dependabot propose le nouveau SHA ou condensat.
# Un regroupement par écosystème limite le nombre de demandes ouvertes en même temps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  # Images de base des Dockerfile (PHP, Composer, PostgreSQL des sauvegardes).
  - package-ecosystem: docker
    directory: /infra/php
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /infra/scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /infra/transcode
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Images du Docker Compose de production (Caddy, PostgreSQL, Redis).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      php-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tests/schema
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

name: ci

# Complète backend.yml / mobile.yml / schema.yml (revue CTO n°1, 4.1) :
#  - infra : construction réelle de l'image Docker, validation du compose, de Caddy, des scripts shell ;
#  - backend-prodlike : suite Pest avec le cache sur Redis (comme en production) et mesure de couverture ;
#  - static-analysis : PHPStan / Larastan niveau 5, BLOQUANT (Larastan est dans composer.json ; les 238 erreurs existantes sont figées
#    dans phpstan-baseline.neon : seule une NOUVELLE erreur fait échouer le job). Mesuré en local le 2026-11-23 ; jamais exécuté ici.
# Le typecheck, le lint et Jest du mobile restent dans mobile.yml (mêmes déclencheurs).
# Les jobs marqués `continue-on-error` n'ont JAMAIS tourné : repasser en bloquant une fois la première exécution connue.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # lundi 03:17 UTC : détecte une dérive d'image de base ou de dépendance sans commit
  push:
    paths:
      - 'infra/**'
      - 'backend/**'
      - 'docs/schema/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/phpstan.neon'
      - '.github/workflows/phpstan-baseline.neon'
  pull_request:
    paths:
      - 'infra/**'
      - 'backend/**'
      - 'docs/schema/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/phpstan.neon'
      - '.github/workflows/phpstan-baseline.neon'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image de l'application (runtime), avec images de base à jour
        run: docker build --pull --target runtime -f infra/php/Dockerfile -t ayelo-app:ci .

      - name: Configuration PHP-FPM valide (pool de production)
        run: docker run --rm ayelo-app:ci php-fpm -t

      - name: Le pool FPM prend bien les valeurs du Dockerfile
        run: |
          docker run --rm ayelo-app:ci php-fpm -tt 2>&1 | tee /tmp/fpm.txt
          grep -E 'pm.max_children = 24' /tmp/fpm.txt
          grep -E 'request_terminate_timeout = 60' /tmp/fpm.txt

      - name: Image de sauvegarde (pg_dump 16, aws, gpg)
        run: docker build --pull -f infra/scripts/Dockerfile -t ayelo-backup:ci infra/scripts

      # Toutes les images que deploy.sh construit doivent l'être ici : un échec découvert au déploiement bloque la production.
      - name: Image de traitement audio et vidéo (conteneur transcode)
        run: docker build --pull -f infra/transcode/Dockerfile -t ayelo-transcode:ci .

      - name: Essai réel de l'image transcode (vrai ffmpeg, mêmes restrictions que la production)
        run: bash infra/scripts/tests/transcode_image_test.sh ayelo-transcode:ci

      - name: docker compose config (variables factices)
        env:
          REDIS_PASSWORD: ci-factice
          DB_DATABASE: app
          DB_USERNAME: app
          DB_PASSWORD: ci-factice
          ACME_EMAIL: ci@example.invalid
          API_DOMAIN: api.example.invalid
          WS_DOMAIN: ws.example.invalid
          ADMIN_DOMAIN: admin.example.invalid
          ADMIN_ALLOWED_IPS: 203.0.113.10/32
          BACKUP_GPG_RECIPIENT: ci@example.invalid
          BACKUP_GPG_PUBLIC_KEY_PATH: ${{ github.workspace }}/infra/.env.prod.example
        run: |
          cp infra/.env.prod.example infra/.env.prod
          docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml config -q
          echo "compose valide"

      - name: Le compose refuse de démarrer sans destinataire GPG (chiffrement obligatoire)
        env:
          REDIS_PASSWORD: ci-factice
          DB_DATABASE: app
          DB_USERNAME: app
          DB_PASSWORD: ci-factice
          BACKUP_GPG_RECIPIENT: ''
          BACKUP_GPG_PUBLIC_KEY_PATH: ${{ github.workspace }}/infra/.env.prod.example
        run: |
          cp infra/.env.prod.example infra/.env.prod
          if docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml config -q 2>/tmp/err.txt; then
            echo "ERREUR : le compose accepte un BACKUP_GPG_RECIPIENT vide"; exit 1
          fi
          grep -q BACKUP_GPG_RECIPIENT /tmp/err.txt

      - name: Caddyfile valide
        run: |
          docker run --rm \
            -e ACME_EMAIL=ci@example.invalid -e API_DOMAIN=api.example.invalid -e WS_DOMAIN=ws.example.invalid \
            -e ADMIN_DOMAIN=admin.example.invalid -e WEB_DOMAIN=www.example.invalid -e ADMIN_ALLOWED_IPS=203.0.113.10/32 \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8 caddy validate --config /etc/caddy/Caddyfile

      - name: "shellcheck des scripts d'infrastructure (informatif, jamais exécuté)"
        continue-on-error: true
        run: shellcheck --severity=warning infra/scripts/*.sh infra/scripts/tests/*.sh

      - name: Test de la logique de rétention des sauvegardes
        run: bash infra/scripts/tests/retention_test.sh

      - name: Test des alertes d'échec de sauvegarde (faux pg_dump et curl, aucun envoi)
        run: bash infra/scripts/tests/backup_alert_test.sh

      - name: Test de l'ordre des étapes de deploy.sh (faux docker, aucune commande réelle)
        run: bash infra/scripts/tests/deploy_test.sh

      - name: Test de configure-env.sh (écriture des valeurs, secrets jamais affichés)
        run: bash infra/scripts/tests/configure_env_test.sh

      - name: Test de la sonde externe (repli statique en 200 jamais pris pour un site sain ; faux curl)
        run: bash infra/scripts/tests/probe_externe_test.sh

      - name: Test de l'essai du routage Caddy (Caddyfile d'essai généré, défauts attrapés ; faux docker et curl)
        run: bash infra/scripts/tests/caddy_routage_test.sh

      - name: Essai du traitement des notes vocales et vidéos (faux ffmpeg)
        run: bash infra/scripts/tests/transcode_test.sh

      - name: hadolint (informatif)
        continue-on-error: true
        run: |
          docker run --rm -i hadolint/hadolint < infra/php/Dockerfile
          docker run --rm -i hadolint/hadolint < infra/scripts/Dockerfile
          docker run --rm -i hadolint/hadolint < infra/transcode/Dockerfile

  backend-prodlike:
    # Même magasin de cache qu'en production (Redis) + couverture. BLOQUANT depuis le 2026-11-24 (première exécution réellement
    # verte : 718 réussis, 2 sautés, couverture totale 94,7 %).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, sodium, gd, exif, pcntl
          coverage: pcov
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: "Pest avec CACHE_STORE=redis et couverture (seuil global 92 %)"
        # Seuil global 92 % : 2 à 3 points sous la mesure du 2026-11-24 (94,7 %), au-dessus des planchers de docs/13-TEST-STRATEGY.md
        # (70 % global, 85 % services critiques). Pas de seuil par service : Pest ne le propose pas.
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: redis
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          # Sans pipefail, `| tee` renvoie le code de sortie de tee (0) : 33 tests en échec ont été vus « verts » (2026-11-23).
          set -o pipefail
          status=0
          vendor/bin/pest --coverage --min=92 --coverage-clover=coverage.xml | tee coverage.txt || status=$?
          {
            echo '### Couverture Pest (rapport)'
            echo '```'
            grep -E 'Total|Cov|Tests:' coverage.txt | tail -n 5 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-clover
          path: backend/coverage.xml
          if-no-files-found: ignore

  static-analysis:
    # PHPStan + Larastan niveau 5, bloquant. Larastan (composer.json, require-dev) lit le schéma dans la base : service postgres et
    # migrations comme pour la suite Pest. Les erreurs déjà présentes sont dans phpstan-baseline.neon ; une nouvelle erreur échoue.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, sodium, gd, exif
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: "PHPStan niveau 5 (baseline figée, seule une nouvelle erreur échoue)"
        run: vendor/bin/phpstan analyse --configuration=../.github/workflows/phpstan.neon --memory-limit=1G --no-progress

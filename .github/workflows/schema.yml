name: schema

on:
  workflow_dispatch:
  push:
    paths:
      - '.gitleaks.toml'
      - 'backend/**'
      - 'mobile/**'
      - 'docs/schema/**'
      - 'tests/schema/**'
      - '.github/workflows/schema.yml'
  pull_request:
    paths:
      - '.gitleaks.toml'
      - 'backend/**'
      - 'mobile/**'
      - 'docs/schema/**'
      - 'tests/schema/**'
      - '.github/workflows/schema.yml'

# Jeton en lecture seule (pentest P-15) : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  postgres16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        working-directory: tests/schema
        run: npm ci --omit=dev
      - name: Schema tests on PostgreSQL 16
        working-directory: tests/schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node schema.test.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (historique complet)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact --verbose

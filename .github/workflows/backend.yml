name: backend

on:
  push:
    paths:
      - 'backend/**'
      - 'docs/schema/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/schema/**'
      - '.github/workflows/backend.yml'

# Jeton en lecture seule (pentest P-15) : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, sodium, gd, exif
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit dependencies
        run: composer audit
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pest on PostgreSQL 16
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: vendor/bin/pest
      - name: Contrat OpenAPI à jour (docs/openapi.json)
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php artisan scramble:export --path=../docs/openapi.json
          git diff --exit-code -- ../docs/openapi.json || (echo "docs/openapi.json n'est pas à jour : lancer php artisan scramble:export --path=../docs/openapi.json" && exit 1)

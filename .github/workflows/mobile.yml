name: mobile

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'design/**'
      - 'web/assets/tokens.css'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'design/**'
      - 'web/assets/tokens.css'
      - '.github/workflows/mobile.yml'

# Jeton en lecture seule (pentest P-15) : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Jetons de design (design/tokens.json et fichiers générés)
        run: npm run tokens:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: "Tests avec couverture (seuil dans jest.config.js, échoue si la couverture baisse)"
        run: npm run test:coverage
      - name: Android bundle (compilation uniquement)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
      - name: Audit des dépendances de production (bloquant à partir de « high »)
        # Sans `continue-on-error` : une vulnérabilité de niveau high ou critical dans une dépendance de production fait échouer le job.
        # Mesuré le 2026-11-23 : 0 high, 21 moderate (non bloquants).
        run: npm audit --omit=dev --audit-level=high

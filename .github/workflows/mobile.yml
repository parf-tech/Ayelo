name: mobile

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

# Jeton en lecture seule (pentest P-15) : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Android bundle (compilation uniquement)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
      - name: Audit des dépendances de production (informatif)
        run: npm audit --omit=dev --audit-level=high
